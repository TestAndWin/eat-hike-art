apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuenfgiebel
  namespace: fuenfgiebel
  labels:
    app.kubernetes.io/name: fuenfgiebel
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: public
  rules:
    - host: www.fuenfgiebel.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fuenfgiebel
                port:
                  name: http
    # Local development with minikube/kind
    - host: e2ecoverage.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fuenfgiebel
                port:
                  name: http
  # TLS configuration
  tls:
    - hosts:
        - www.fuenfgiebel.de
      secretName: fuenfgiebel-tls
