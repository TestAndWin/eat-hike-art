apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuenfgiebel
  namespace: fuenfgiebel
  labels:
    app.kubernetes.io/name: fuenfgiebel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fuenfgiebel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fuenfgiebel
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: fuenfgiebel
          image: fuenfgiebel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fuenfgiebel-config
            - secretRef:
                name: fuenfgiebel-secrets
          volumeMounts:
            - name: data
              mountPath: /var/www/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          hostPath:
            path: /srv/fuenfgiebel/data
            type: DirectoryOrCreate
