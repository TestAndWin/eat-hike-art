apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fuenfgiebel-data
  namespace: fuenfgiebel
  labels:
    app.kubernetes.io/name: fuenfgiebel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Content, images, and sessions storage
      # Estimated: ~50 entries/year with images
      storage: 5Gi
  # Use default storage class in minikube
  # storageClassName: standard
