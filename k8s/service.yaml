apiVersion: v1
kind: Service
metadata:
  name: fuenfgiebel
  namespace: fuenfgiebel
  labels:
    app.kubernetes.io/name: fuenfgiebel
spec:
  # ClusterIP for use with Ingress (default)
  # Change to NodePort for direct access without Ingress
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      # nodePort: 30080  # Uncomment if type is NodePort  
  selector:
    app.kubernetes.io/name: fuenfgiebel
